[project]
license = "Apache-2.0"
name = "course-service"
version = "0.1.0"
description = "Course generation microservice: curriculum planning, lesson dispatch, and course assembly"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]>=0.122.0",
    "uvicorn[standard]>=0.34.0",
    "psycopg[binary,pool]>=3.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    "python-dotenv>=1.0.0",
    "redis>=5.2.0",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    "cachetools>=5.0.0",
    "miniopy-async>=1.21",
    "w2v-common",
    "prometheus-client>=0.24.0",
]

[project.scripts]
course-service = "src.asgi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "ty>=0.0.15",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",
    "bandit>=1.9.4",
]

[tool.uv.sources]
w2v-common = { git = "https://github.com/nonagenticai/w2v_common", tag = "v0.115.4" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "ANN", "B", "BLE", "A", "S", "C901",
    "RUF", "RET", "SIM", "ASYNC", "PTH",
]
ignore = [
    "E501",
    "B008",
    "ANN401",
    "ASYNC240",
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"src/database/migrations/*" = ["I001", "ANN"]
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S107", "S108", "ANN", "PTH", "ASYNC230", "ASYNC240", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "unit: unit tests",
    "integration: integration tests requiring live downstream services",
]
filterwarnings = [
    "ignore:coroutine '.*AsyncMockMixin._execute_mock_call.*' was never awaited:RuntimeWarning",
]

[tool.coverage.report]
fail_under = 80

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
import-not-found = "error"
unresolved-reference = "error"
missing-attribute = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
missing-argument = "error"
invalid-argument-type = "error"
invalid-explicit-return = "error"

[tool.bandit]
targets = ["src/"]
exclude_dirs = ["tests", ".venv", "migrations"]
skips = ["B311"]

[tool.bandit.assert_used]
skips = ["*/tests/*"]
